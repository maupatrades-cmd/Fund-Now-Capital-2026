project_id = "fund-now-capital-2026"

# send-notification-email is invoked server-to-server by the DB (pg_net), not by
# a signed-in user, so it authenticates via the shared X-Webhook-Secret header
# instead of a JWT. Keep verify_jwt = false.
[functions.send-notification-email]
verify_jwt = false

# admin-invite-user / admin-deactivate-user are invoked from the owner's browser.
# They authenticate the CALLER: read the Bearer JWT, verify is_owner() against the
# DB, then use the service-role key for admin work. verify_jwt = false (not true)
# so the function can answer the CORS preflight and return clean JSON errors
# itself — the in-code is_owner() gate is the real authorization backstop.
[functions.admin-invite-user]
verify_jwt = false

[functions.admin-deactivate-user]
verify_jwt = false

# apply-submit-application is the PUBLIC /apply endpoint — anyone on the internet
# can submit an application, so there is no caller to authenticate. verify_jwt =
# false keeps it open; all privileged work goes through the service-role key and
# the service_role-only submit_contractor_application RPC (never anon/authenticated),
# with IP throttling for abuse control.
[functions.apply-submit-application]
verify_jwt = false

# generate-partner-invoice-pdf renders the partner → FNC invoice PDF. Invoked
# server-to-server by the DB (pg_net) on submit, so it authenticates via the
# shared X-Webhook-Secret header (same as generate-invoice-pdf). verify_jwt = false.
[functions.generate-partner-invoice-pdf]
verify_jwt = false

# generate-contractor-invoice-pdf renders the contractor → FNC invoice PDF ON
# DEMAND and returns it inline (base64) — the contractor_invoices table has no
# stored PDF path. Invoked from the contractor's / owner's BROWSER, so it
# authenticates the CALLER (Bearer JWT) and scopes every read to the caller's
# RLS. verify_jwt = false so it can answer the CORS preflight and return clean
# JSON errors itself; the in-function getUser() + RLS are the real gate.
[functions.generate-contractor-invoice-pdf]
verify_jwt = false

# Public client sign-in request endpoint. It returns a non-enumerating response,
# applies database-backed throttling, and performs privileged work only with the
# service role inside the function. verify_jwt=false also permits CORS preflight.
[functions.request-client-magic-link]
verify_jwt = false

# Invitation endpoints handle browser preflight themselves. Creation validates
# the caller JWT in-function; resolution deliberately accepts an opaque token.
[functions.create-client-invitation]
verify_jwt = false

[functions.resolve-client-invitation]
verify_jwt = false

# generate-legal-document-pdf renders a branded A4 legal document PDF (spec PR 6).
# Invoked server-side with a shared X-Webhook-Secret header (no caller JWT), same
# pattern as generate-invoice-pdf / send-notification-email.
[functions.generate-legal-document-pdf]
verify_jwt = false

# ingest-legal-source-asset (Build 4) hashes an uploaded legal source PDF
# server-side and verifies it against the approved digest. Invoked from the
# owner's browser; it authenticates the caller itself (is_owner()), so
# verify_jwt = false (to answer CORS preflight + return clean JSON errors).
[functions.ingest-legal-source-asset]
verify_jwt = false
