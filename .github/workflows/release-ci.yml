name: Release CI Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile production build
        env:
          # Public placeholders keep the CRM in the bundle without live credentials.
          VITE_SUPABASE_URL: https://build-validation.supabase.co
          VITE_SUPABASE_ANON_KEY: build-validation-only-not-a-deployment-key
        run: npm run build

      - name: Lint source
        run: npm run lint

      - name: Verify repository RPC and Edge Function contracts
        run: npm run test:repository-contracts

      - name: Verify canonical build register
        run: npm run test:build-register

      - name: Verify release activation controller
        run: npm run test:release-activation

      - name: Run zero-write cross-role contract suites
        run: npm run test:cross-role-e2e

      - name: Verify money command centre contracts
        run: npm run test:money-command-center

      - name: Verify CI safety contract
        run: npm run test:release-ci

      - name: Verify reward payroll contracts
        run: npm run test:r100-reward-payroll

      - name: Verify document checklist states
        run: node --test tests/document-checklist-states.test.mjs

      - name: Execute isolated PostgreSQL payroll regression
        run: npm run test:payroll-sql
